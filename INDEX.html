<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Closing Report – The Biryaniwalla</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#120708;--card:#1f0d10;--gold:#c9a14a;--tx:#f3e9d2;--mut:#b9a98a;--red:#ff6b6b;--grn:#6fd08c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"],:root[data-theme="dark"]{}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;padding-bottom:90px}
header{text-align:center;padding:18px 12px 8px;background:linear-gradient(#3a0d14,var(--bg));border-bottom:1px solid var(--gold)}
h1{margin:0;color:var(--gold);letter-spacing:4px;font-size:24px}header p{margin:4px 0 0;color:var(--mut);font-size:14px}
nav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid #3a2a20;overflow-x:auto}
nav button{flex:1;min-width:64px;padding:14px 6px;background:none;border:0;color:var(--mut);font:600 14px Georgia;border-bottom:3px solid transparent}
nav button.on{color:var(--gold);border-color:var(--gold)}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid #4a3320;border-radius:12px;padding:12px;margin-bottom:12px}
h2{color:var(--gold);font-size:16px;margin:0 0 10px;letter-spacing:1px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,textarea,select{width:100%;padding:12px;font-size:17px;border-radius:8px;border:1px solid #6b4c2a;background:#0d0506;color:var(--tx);font-family:inherit}
input[type=number]{text-align:right}textarea{min-height:70px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{flex:1}.row .w{flex:none;width:auto}
.sum div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted #4a3320}
.big{font-size:20px;font-weight:700;text-align:center;padding:12px;border-radius:10px;margin-top:8px}
.SHORT{background:#5a1515;color:var(--red);border:2px solid var(--red)}.OVER{background:#153a24;color:var(--grn)}.BAL{background:#153a24;color:var(--grn)}
.btn{padding:14px;border-radius:10px;border:1px solid var(--gold);background:#2a1216;color:var(--gold);font:700 15px Georgia;width:100%}
.btn.p{background:var(--gold);color:#120708}.mut{color:var(--mut);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#0d0506;border-top:1px solid var(--gold);z-index:9}
.bar .btn{padding:11px 4px;font-size:13px}
pre{white-space:pre-wrap;font:14px/1.4 ui-monospace,Menlo,monospace;background:#0d0506;padding:12px;border-radius:8px;border:1px solid #4a3320;overflow-x:auto}
.it{padding:8px 0;border-bottom:1px dotted #4a3320}.it b{display:block;margin-bottom:4px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.g3 label{margin:0;font-size:11px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--gold);color:#120708;padding:10px 16px;border-radius:20px;z-index:20;font-weight:700}
</style></head><body>

<div class="bar"><button class="btn" onclick="saveDraft()">SAVE DRAFT</button><button class="btn" onclick="tab='Report';R()">GENERATE REPORT</button><button class="btn" onclick="share()">SHARE REPORT</button><button class="btn p" onclick="complete()">COMPLETE CLOSING</button></div>
<script>
const CATS=['Beer','Whisky','Rum','Vodka','Gin','Tequila','Wine'],HARD=['Whisky','Rum','Vodka','Gin','Tequila','Wine'];
const DEN=[['5¢',.05],['10¢',.1],['25¢',.25],['$1',1],['$2',2],['$5',5],['$10',10],['$20',20],['$50',50],['$100',100]];
const DEF={Beer:['Budweiser','Coors','Corona','Kingfisher','Stella'],Whisky:['Crown Royal','Ballantine','Black Label','Glenfiddich 12 Years','Chivas Regal'],Rum:['Captain Morgan','White Rum','Old Monk'],Vodka:['Absolut','Smirnoff'],Gin:['Bombay Sapphire','Tanqueray'],Tequila:['1800 Blanco','Don Julio Blanco'],Wine:['House Red','House White']};
const TABS=['Cash','Alcohol','Notes','Report','History'];
let tab='Cash',cfg={till:250,pin:'1234',inv:[]},D=null,hist=[],mgr=false,db=null,busy=false;
const $=id=>document.getElementById(id),n=v=>{v=parseFloat(v);return isFinite(v)&&v>0?v:0},f=v=>'$'+v.toFixed(2)+' CAD'.slice(0,0);
const today=()=>new Date().toISOString().slice(0,10);
const defInv=()=>CATS.flatMap(c=>DEF[c].map(x=>({c,n:x,o:HARD.includes(c)?750:24})));
const newDraft=()=>({date:today(),by:'',rev:'',cs:'',sales:{},ce:'',den:{},exp:[],sold:{},waste:[],fb:'',notes:''});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
// storage
async function load(){
 try{db=await claude.use('db')}catch(e){db=null}
 try{if(db){const c=await db.doc('app/config').get();if(c.exists)cfg=c.data();const d=await db.doc('app/draft').get();if(d.exists)D=d.data().d;const h=await db.collection('reports').get();hist=h.docs.map(x=>x.data())}
 else{cfg=JSON.parse(localStorage.getItem('cfg')||'null')||cfg;D=JSON.parse(localStorage.getItem('draft')||'null');hist=JSON.parse(localStorage.getItem('hist')||'[]')}}catch(e){}
 if(!cfg.inv||!cfg.inv.length)cfg.inv=defInv();if(!D)D=newDraft();if(!D.sales)D.sales={};
 hist.sort((a,b)=>b.at>a.at?1:-1);R()}
async function put(k,v){try{if(db){if(k==='cfg')await db.doc('app/config').set(v);else if(k==='draft')await db.doc('app/draft').set({d:v});else await db.doc('reports/'+v.id).set(v)}
 else{if(k==='hist')hist=[v,...hist],localStorage.setItem('hist',JSON.stringify(hist));else localStorage.setItem(k,JSON.stringify(v))}return true}catch(e){toast('Save failed');return false}}
// calcs
const key=i=>i.c+'|'+i.n;
function calc(){const till=+cfg.till||250,cs=n(D.cs),sl=D.sales||{},gross=Math.round((cs+['uber','et','visa','dd','skip'].reduce((a,k)=>a+n(sl[k]),0))*100)/100,hst=Math.round(gross*13)/100,net=Math.round((gross-hst)*100)/100,ce=D.exp.reduce((s,e)=>s+n(e.amt),0)+n(D.ce);
 const exp=till+cs-ce,env=Math.max(0,cs-ce);let phys=0;DEN.forEach(([l,v])=>phys+=n(D.den[l])*v);phys=Math.round(phys*100)/100;
 const diff=Math.round((phys-exp)*100)/100;
 const alc=cfg.inv.map(i=>{const s=D.sold[key(i)]||{};let used,sold;if(HARD.includes(i.c)){used=30*Math.floor(n(s.a))+60*Math.floor(n(s.b))}else{used=Math.floor(n(s.s))}
  return{...i,s,used,avail:Math.max(0,n(i.o)-used),over:used>n(i.o)}});
 return{gross,hst,net,till,cs,ce,exp,env,phys,diff,alc}}
const st=d=>d<-0.004?f(-d)+' SHORT':d>0.004?f(d)+' OVER':'$0.00 BALANCED';
function text(d,c){const L=[];const P=x=>L.push(x);
 P('THE BIRYANIWALLA\nDAILY CLOSING REPORT');P('Date: '+d.date);P('Closed By: '+(d.by||'-'));P('Number of Reviews Today: '+n(d.rev));
 P('\nSALES');[['Uber','uber'],['E-transfer','et'],['Visa','visa'],['Doordash','dd']].forEach(([l,k])=>P(l+': '+f(n((d.sales||{})[k]))));P('Cash: '+f(c.cs));P('Skip: '+f(n((d.sales||{}).skip)));P('Gross Total: '+f(c.gross));P('HST 13%: '+f(c.hst));P('Net Total: '+f(c.net));P('\nCASH CLOSING');P('Opening Till: '+f(c.till));P('Cash Sales: '+f(c.cs));P('Cash Expenses: '+f(c.ce));P('Expected Till: '+f(c.exp));P('Physical Till: '+f(c.phys));P('Cash Difference: '+st(c.diff));P('Expected Cash in Envelope: '+f(c.env));P('Leave in Till: '+f(c.till));
 P('\nDENOMINATIONS');DEN.forEach(([l,v])=>{const q=n(d.den[l]);if(q)P(l+' × '+q+' = '+f(q*v))});
 if(d.exp.length){P('\nEXPENSES');d.exp.forEach(e=>P('- '+(e.n||'Expense')+': '+f(n(e.amt))+(e.note?' ('+e.note+')':'')))}
 P('\nALCOHOL');CATS.forEach(cat=>{const r=c.alc.filter(a=>a.c===cat);if(!r.length)return;P(cat.toUpperCase());r.forEach(a=>P(HARD.includes(cat)?`${a.n}: Open ${a.o}ml | 30ml×${n(a.s.a)} 60ml×${n(a.s.b)} | Used ${a.used}ml | Avail ${a.avail}ml`:`${a.n}: Open ${a.o} | Sold ${n(a.s.s)} | Avail ${a.avail}`))});
 P('\nWASTAGE');d.waste.length?d.waste.forEach(w=>P('- '+w.i+' | '+w.q+(w.note?' | '+w.note:''))):P('None');
 P('\nCUSTOMER FEEDBACK / COMPLAINTS\n'+(d.fb||'None'));P('\nNOTES\n'+(d.notes||'None'));return L.join('\n')}
// UI
function R(){$('nav').innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';R()">${t=='Notes'?'Details':t}</button>`).join('');
 const m=$('m');m.innerHTML=({Cash,Alcohol,Notes,Report,History})[tab]();U()}
const bind=(p,k,t)=>`value="${(p[k]??'')}" oninput="${t}"`;
function Cash(){return `<div class="card"><h2>GENERAL</h2><label>Date</label><input type="date" ${bind(D,'date','D.date=this.value')}><label>Closed By</label><input ${bind(D,'by','D.by=this.value')} placeholder="Your name"><label>Number of Reviews Today</label><input type="number" inputmode="numeric" min="0" ${bind(D,'rev','D.rev=this.value')}></div>
<div class="card"><h2>SALES BY TYPE</h2>${[['Uber','uber'],['E-transfer','et'],['Visa','visa'],['Doordash','dd']].map(([l,k])=>`<div class="row"><b style="flex:none;width:96px">${l}</b><input type="number" inputmode="decimal" min="0" placeholder="0.00" ${bind(D.sales,k,`D.sales.${k}=this.value;U()`)}></div>`).join('')}<div class="row"><b style="flex:none;width:96px">Cash</b><input type="number" inputmode="decimal" min="0" placeholder="0.00" ${bind(D,'cs','D.cs=this.value;U()')}></div><div class="row"><b style="flex:none;width:96px">Skip</b><input type="number" inputmode="decimal" min="0" placeholder="0.00" ${bind(D.sales,'skip','D.sales.skip=this.value;U()')}></div><div class="sum"><div><span>Gross Total</span><b id="gt"></b></div><div><span>HST 13%</span><b id="hs"></b></div><div><span>Net Total</span><b id="nt"></b></div></div></div>
<div class="card"><h2>CASH</h2><div class="mut">Opening till (fixed): <b id="till"></b></div><div class="mut">Cash Sales (entered above): <b id="cs_show"></b></div>
<label>Other Cash Expenses (optional)</label><input type="number" inputmode="decimal" min="0" ${bind(D,'ce','D.ce=this.value;U()')}>
<h2 style="margin-top:14px">EXPENSES</h2>${D.exp.map((e,i)=>`<div class="it"><input placeholder="Store / type" ${bind(e,'n',`D.exp[${i}].n=this.value`)}><div class="row"><input type="number" inputmode="decimal" placeholder="Amount" ${bind(e,'amt',`D.exp[${i}].amt=this.value;U()`)}><input placeholder="Note" ${bind(e,'note',`D.exp[${i}].note=this.value`)}><button class="btn w" onclick="D.exp.splice(${i},1);R()">✕</button></div></div>`).join('')}<button class="btn" onclick="D.exp.push({});R()">+ Add Expense</button><div class="mut" style="margin-top:6px">Total expenses: <b id="ce"></b></div></div>
<div class="card"><h2>COUNT THE TILL</h2>${DEN.map(([l,v])=>`<div class="row"><b style="flex:none;width:52px">${l}</b><input type="number" inputmode="numeric" min="0" placeholder="0" ${bind(D.den,l,`D.den['${l}']=this.value;U()`)}><span class="w" id="d${v}" style="width:80px;text-align:right"></span></div>`).join('')}</div>
<div class="card sum"><h2>CASH SUMMARY</h2>${['Opening Till|o','Cash Sales|cs2','Cash Expenses|ce2','Expected Till|ex','Physical Till|ph','Expected Cash in Envelope|en','Leave in Till|lv'].map(x=>{const[a,b]=x.split('|');return`<div><span>${a}</span><b id="s_${b}"></b></div>`}).join('')}<div class="big" id="diff"></div></div>`}
function Alcohol(){const c=calc();return `<div class="mut" style="margin-bottom:8px">${mgr?'Manager mode: edit opening stock':'Enter sold quantities only'} · <a href="#" style="color:var(--gold)" onclick="mgrToggle();return false">${mgr?'Exit manager':'Manager login'}</a></div>`+CATS.map(cat=>`<div class="card"><h2>${cat.toUpperCase()}</h2>${c.alc.filter(a=>a.c===cat).map(a=>{const k=key(a),H=HARD.includes(cat);return`<div class="it"><b>${a.n} ${mgr?`<button class="btn w" style="padding:3px 8px;font-size:12px;width:auto" onclick="delItem('${k}')">remove</button>`:''}</b><div class="g3">${H?`<div><label>Opening ML</label>${mgr?`<input type="number" value="${a.o}" onchange="setOpen('${k}',this.value)">`:`<input readonly value="${a.o}">`}</div><div><label>30 ML sold</label><input type="number" inputmode="numeric" min="0" placeholder="0" ${bind(a.s,'a',`sd('${k}','a',this.value)`)}></div><div><label>60 ML sold</label><input type="number" inputmode="numeric" min="0" placeholder="0" ${bind(a.s,'b',`sd('${k}','b',this.value)`)}></div>`:`<div><label>Opening</label>${mgr?`<input type="number" value="${a.o}" onchange="setOpen('${k}',this.value)">`:`<input readonly value="${a.o}">`}</div><div><label>Sold</label><input type="number" inputmode="numeric" min="0" placeholder="0" ${bind(a.s,'s',`sd('${k}','s',this.value)`)}></div>`}<div><label>Available</label><input readonly id="av_${k.replace(/\W/g,'_')}"></div></div>${H?`<div class="mut" id="us_${k.replace(/\W/g,'_')}"></div>`:''}</div>`}).join('')}</div>`).join('')+(mgr?`<div class="card"><h2>+ ADD ALCOHOL ITEM</h2><select id="ac">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><label>Item name</label><input id="an"><label>Opening quantity / ML</label><input id="ao" type="number"><div style="height:8px"></div><button class="btn p" onclick="addItem()">Add Item</button></div>`:'')}
function Notes(){return `<div class="card"><h2>WASTAGE</h2>${D.waste.map((w,i)=>`<div class="it"><input placeholder="Item" ${bind(w,'i',`D.waste[${i}].i=this.value`)}><div class="row"><input placeholder="Qty / %" ${bind(w,'q',`D.waste[${i}].q=this.value`)}><input placeholder="Notes" ${bind(w,'note',`D.waste[${i}].note=this.value`)}><button class="btn w" onclick="D.waste.splice(${i},1);R()">✕</button></div></div>`).join('')}<button class="btn" onclick="D.waste.push({});R()">+ Add Wastage</button></div>
<div class="card"><h2>CUSTOMER FEEDBACK / COMPLAINTS</h2><textarea oninput="D.fb=this.value">${D.fb}</textarea></div><div class="card"><h2>GENERAL CLOSING NOTES</h2><textarea oninput="D.notes=this.value">${D.notes}</textarea></div>`}
function Report(){return `<div class="card"><h2>REPORT PREVIEW</h2><pre>${esc(text(D,calc()))}</pre><button class="btn" onclick="share()">Share / Copy Report</button></div>`}
function History(){return `<div class="card"><h2>CLOSING HISTORY</h2>${mgr?'':'<div class="mut">Manager login required to open reports. <a href="#" style="color:var(--gold)" onclick="mgrToggle();return false">Login</a></div>'}${hist.map((h,i)=>`<div class="it"><b>${h.date} — ${esc(h.by||'-')} <span class="mut">${h.status}</span></b><div class="mut">Reviews ${h.rev} · Diff ${esc(st(h.diff))} · Envelope ${f(h.env)}</div>${mgr?`<button class="btn" style="margin-top:6px" onclick="openH(${i})">Open report</button><pre id="h${i}" hidden>${esc(h.text)}</pre>`:''}</div>`).join('')||'<div class="mut">No completed closings yet.</div>'}</div>`}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function openH(i){$('h'+i).hidden=!$('h'+i).hidden}
function U(){const c=calc(),s=(id,v)=>{const e=$(id);if(e)e.textContent=v};
 s('till',f(c.till));s('cs_show',f(c.cs));s('gt',f(c.gross));s('hs',f(c.hst));s('nt',f(c.net));s('ce',f(c.ce));DEN.forEach(([l,v])=>s('d'+v,f(n(D.den[l])*v)));
 s('s_o',f(c.till));s('s_cs2',f(c.cs));s('s_ce2',f(c.ce));s('s_ex',f(c.exp));s('s_ph',f(c.phys));s('s_en',f(c.env));s('s_lv',f(c.till));
 const d=$('diff');if(d){d.textContent=st(c.diff);d.className='big '+(c.diff<-0.004?'SHORT':c.diff>0.004?'OVER':'BAL')}
 c.alc.forEach(a=>{const k=key(a).replace(/\W/g,'_'),e=$('av_'+k);if(e){e.value=a.avail+(HARD.includes(a.c)?' ml':'');e.style.borderColor=a.over?'var(--red)':''}const u=$('us_'+k);if(u)u.textContent='Used: '+a.used+' ml'+(a.over?' ⚠ exceeds opening':'')})}
function sd(k,f2,v){D.sold[k]=D.sold[k]||{};D.sold[k][f2]=v;U()}
function mgrToggle(){if(mgr){mgr=false}else{const p=prompt('Manager PIN');if(p===String(cfg.pin))mgr=true;else if(p!==null)toast('Wrong PIN')}R()}
async function setOpen(k,v){const i=cfg.inv.find(x=>key(x)==k);i.o=n(v);await put('cfg',cfg);R()}
async function delItem(k){if(!confirm('Remove item?'))return;cfg.inv=cfg.inv.filter(x=>key(x)!=k);await put('cfg',cfg);R()}
async function addItem(){const nm=$('an').value.trim();if(!nm)return toast('Enter a name');cfg.inv.push({c:$('ac').value,n:nm,o:n($('ao').value)});await put('cfg',cfg);R()}
async function saveDraft(){if(await put('draft',D))toast('Draft saved')}
async function share(){const t=text(D,calc());if(navigator.share){try{await navigator.share({title:'Daily Closing Report',text:t});return}catch(e){if(e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(t);toast('Report copied')}catch(e){tab='Report';R();toast('Select & copy the report')}}
async function complete(){if(busy)return;const c=calc(),err=[];
 if(!D.by.trim())err.push('Enter "Closed By"');if(D.rev==='')err.push('Enter number of reviews');if(D.cs==='')err.push('Enter cash sales');if(!c.phys)err.push('Count the till');if(c.alc.some(a=>a.over))err.push('Sold exceeds opening stock for some alcohol');
 if(hist.some(h=>h.date===D.date&&h.status==='Completed')&&!confirm('A closing for '+D.date+' already exists. Complete another?'))return;
 if(err.length)return alert(err.join('\n'));
 if(!confirm("Complete today's closing? This will save the final report and roll available alcohol inventory into the next opening stock."))return;
 busy=true;const rep={id:'r'+Date.now(),at:new Date().toISOString(),date:D.date,by:D.by,rev:n(D.rev),diff:c.diff,env:c.env,status:'Completed',text:text(D,c),data:D};
 if(!(await put('hist',rep))){busy=false;return}
 cfg.inv=cfg.inv.map(i=>({...i,o:c.alc.find(a=>key(a)==key(i)).avail}));
 if(!(await put('cfg',cfg))){busy=false;return alert('Report saved but inventory roll failed. Ask a manager to correct opening stock.')}
 if(db)hist=[rep,...hist];D=newDraft();await put('draft',D);busy=false;tab='History';R();toast('Closing completed')}
load();
</script></body></html>
